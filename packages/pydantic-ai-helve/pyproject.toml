[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-helve"
version = "0.1.1"
description = "PydanticAI Capability and MCP helper for Helve — pay-per-call AI tool gateway (324 tools, 257 providers, 0% markup) with spend_limit_usd caps."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Helve", email = "daniel.foster@helve.dev"}]
keywords = ["pydantic-ai", "mcp", "ai-agents", "tools", "helve"]
dependencies = [
  "pydantic-ai-slim>=1.0.0",
  "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://helve.dev"
Documentation = "https://docs.helve.dev"
"llms.txt" = "https://helve.dev/llms.txt"
Repository = "https://github.com/helve-dev/helve-mcp"

[tool.setuptools.packages.find]
include = ["pydantic_ai_helve*"]
