[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-helve"
version = "0.1.0"
description = "LangChain tools for Helve — the metered pay-per-call all-tools gateway and tool-search MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "langchain-core>=0.3.0",
  "helve>=0.1.1",
  "httpx>=0.27.0",
  "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://helve.dev"
Documentation = "https://docs.helve.dev"
"llms.txt" = "https://helve.dev/llms.txt"
Repository = "https://github.com/helve-dev/helve-mcp"
