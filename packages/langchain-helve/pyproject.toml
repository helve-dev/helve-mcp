[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-helve"
version = "0.1.0"
description = "LangChain toolkit for Helve — pay-per-call AI tool gateway (313 tools, 255 providers) with spend_limit_usd caps and zero-cost failed-call escrow."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Helve", email = "daniel.foster@helve.dev" }
]
keywords = ["langchain", "langgraph", "helve", "ai-agents", "tools", "mcp", "api-gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://helve.dev"
Documentation = "https://docs.helve.dev"
"llms.txt" = "https://helve.dev/llms.txt"
Repository = "https://github.com/helve-dev/helve-mcp"
