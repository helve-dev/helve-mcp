[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-framework-helve"
version = "0.1.0"
description = "Microsoft Agent Framework & CrewAI / Agno / Smolagents gateway tools for Helve."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://helve.dev"
Documentation = "https://docs.helve.dev"
"llms.txt" = "https://helve.dev/llms.txt"
Repository = "https://github.com/helve-dev/helve-mcp"
